<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard — UddoktaHon</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<header class="nav"><a class="brand" href="index.html">Uddokta<span>Hon</span></a><div><button id="logoutBtn" class="btn small ghost">Logout</button></div></header>
<main class="dashboard section">
  <div class="dash-head"><div><p class="eyebrow">MY BUSINESS</p><h1>Dashboard</h1></div><div id="statusBadge" class="badge pending">Pending</div></div>
  <div class="stats">
    <div class="stat"><span>Unique ID</span><strong id="uidCode">—</strong></div>
    <div class="stat"><span>Package</span><strong id="pkg">Not activated</strong></div>
    <div class="stat"><span>Account</span><strong id="accountState">Pending</strong></div>
  </div>
  <section class="panel">
    <h2>Activation</h2><p id="activationText">Your account is pending. Choose a package and send your activation request on WhatsApp.</p>
    <a class="btn primary" href="index.html#packages">View packages</a>
  </section>
  <section id="adminPanel" class="panel hidden">
    <h2>Admin — Account Activation</h2>
    <form id="activateForm" class="inline-form">
      <input id="searchCode" placeholder="UDD-1001" required>
      <select id="packageSelect"></select>
      <button class="btn primary" type="submit">Activate</button>
    </form>
    <div id="adminMsg" class="msg"></div>
  </section>
</main>
<script type="module" src="js/dashboard.js"></script>
</body></html>
